apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 65.0.0
    helm:
      valueFiles:
        - https://raw.githubusercontent.com/benzac708/platform-config/main/monitoring/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # k3s v1.35 adds status.terminatingReplicas to Deployments, a field that is
  # not in Argo CD's bundled OpenAPI schema. Without this ignore rule the diff
  # engine throws a ComparisonError and the app shows Unknown/OutOfSync, which
  # disables selfHeal even though every pod is Healthy and Running.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true