# ConfigMap for cloudflared ingress rules (mounted as /etc/cloudflared/config.yaml)
# Applied during Step 5 of the build sequence.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: platform
data:
  config.yaml: |
    tunnel: 32e7ab29-2bbc-4f2f-ba86-6f139d50b7b4
    credentials-file: /etc/cloudflared/creds.json
    ingress:
      - hostname: task-api.zachara.dev
        service: http://task-api.apps.svc.cluster.local:8000
      - hostname: status.zachara.dev
        service: http://monitoring-grafana.monitoring.svc.cluster.local:80
      - hostname: grafana.zachara.dev
        service: http://monitoring-grafana.monitoring.svc.cluster.local:80
      - hostname: argocd.zachara.dev
        service: http://argocd-server.argocd.svc.cluster.local:80
      - service: http_status:404