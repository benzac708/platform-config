# kube-prometheus-stack values for the k3d portfolio cluster.
# Pinned chart version: 65.0.0 (see apps/monitoring.yaml).
# Applied during Step 6 of the build sequence.

grafana:
  admin:
    existingSecret: grafana-admin
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_name: Main Org.
      org_role: Viewer
  env:
    GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /d/portfolio/portfolio
    GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_UID: portfolio
  ingress:
    enabled: false  # Grafana is exposed via Cloudflare Tunnel, not Ingress

prometheus:
  prometheusSpec:
    retention: 7d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi

# Alertmanager disabled in v1 (no alerts defined). Re-enable in v2.
alertmanager:
  enabled: false

# Loki + Promtail installed as separate Argo CD apps (warden-config/loki/).