# kube-prometheus-stack values for the k3d portfolio cluster.
# Pinned chart version: 65.0.0 (see apps/monitoring.yaml).
# Applied during Step 6 of the build sequence.

grafana:
  adminUser: admin
  adminPassword: Grafana123!  # rotate before production
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_name: Main Org.
      org_role: Viewer
  env:
    GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /d/portfolio/portfolio
  ingress:
    enabled: false  # Grafana is exposed via Cloudflare Tunnel, not Ingress

prometheus:
  prometheusSpec:
    retention: 7d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi

# Loki is installed separately as a subchart or standalone in Step 6.